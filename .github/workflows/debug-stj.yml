name: Debug STJ 403 (temporário)

on:
  workflow_dispatch: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: IP público do runner
        run: curl -s https://api.ipify.org; echo

      - name: curl verboso contra o feed do STJ (mesmo UA do coletor)
        run: |
          curl -s -D - -o body.html \
            -A "BoletimJuridicoNexLicit/0.1 (uso pessoal e nao comercial; ver docs/ARQUITETURA.md)" \
            -L "https://ww2.stj.jus.br/jurisprudencia/externo/InformativoFeed"
          echo "=== CORPO, sem a linha do SVG em base64 (que é gigante) ==="
          grep -v "data:image" body.html
          echo "=== texto legível, sem tags HTML ==="
          sed 's/<[^>]*>/ /g' body.html | grep -v "data:image" | tr -s ' \n' ' \n'
