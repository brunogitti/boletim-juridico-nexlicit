# Versões de action confirmadas em 2026-08-12 (release mais recente na
# época): actions/checkout@v7, actions/setup-python@v7.
name: Boletim diário

on:
  schedule:
    - cron: '37 9 * * *'  # 06:37 BRT — UTC-3 fixo, Brasil sem horário de verão
  workflow_dispatch: {}

permissions:
  contents: write  # push na branch `data`

env:
  DATABASE_PATH: boletim.db

jobs:
  boletim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar banco da branch data (se existir)
        run: |
          git fetch origin data --depth=1 2>/dev/null || true
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git show origin/data:boletim.db > boletim.db
            echo "banco restaurado da branch data"
          else
            echo "branch data ainda não existe — começando com banco novo"
          fi
          echo "HASH_BANCO_ANTES=$(sha256sum boletim.db 2>/dev/null | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Coleta (Camada 1)
        id: coleta
        continue-on-error: true
        run: python -m scripts.coletar_tudo

      - name: Fatiamento + dedup + triagem (Camadas 2-4)
        id: triagem
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.rodar_triagem --reprocessar-erros

      - name: Análise (Camada 5)
        id: analise
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.rodar_analise

      - name: Boletim + envio (Camadas 6-7)
        id: boletim
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: python -m scripts.rodar_boletim

      - name: Persistir banco na branch data
        id: persistir
        if: always()
        run: |
          HASH_BANCO_DEPOIS=$(sha256sum boletim.db 2>/dev/null | cut -d' ' -f1)
          echo "hash antes do pipeline:  $HASH_BANCO_ANTES"
          echo "hash depois do pipeline: $HASH_BANCO_DEPOIS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin data --depth=1 2>/dev/null || true

          # branch data isolada num worktree separado -- a working tree
          # principal (onde nucleo/scripts vivem) nunca troca de branch.
          # Achado real (2026-08-22): checkout -B sobrescrevia
          # silenciosamente o boletim.db recém-modificado (porque *.db é
          # gitignored no master, e checkout não protege arquivo ignorado
          # contra sobrescrita) — 9 dias de commits vazios sem ninguém
          # perceber, mascarados por --allow-empty. checkout -B também
          # apagava nucleo/scripts da working tree (não existem na branch
          # data), o que quebraria o step de notificação de falha se o
          # push falhasse antes do "checkout master" final rodar.
          if git ls-remote --exit-code --heads origin data > /dev/null 2>&1; then
            git worktree add "$RUNNER_TEMP/data-branch" data
          else
            git worktree add --orphan -b data "$RUNNER_TEMP/data-branch"
          fi

          cp boletim.db "$RUNNER_TEMP/data-branch/boletim.db"
          cd "$RUNNER_TEMP/data-branch"
          git add -f boletim.db

          if git diff --cached --quiet -- boletim.db; then
            if [ "$HASH_BANCO_ANTES" != "$HASH_BANCO_DEPOIS" ]; then
              # o pipeline mudou o arquivo local (hash mudou) mas não há
              # nada a persistir contra a branch data -- exatamente a
              # assinatura do bug de 13 a 21/08. Falha o job de
              # propósito: melhor alerta vermelho do que outros 9 dias
              # mudos. Sem continue-on-error neste step, de propósito.
              echo "::error::pipeline modificou boletim.db mas não há diferença a persistir na branch data -- possível regressão do bug de isolamento do checkout. Investigar antes do próximo run."
              cd "$GITHUB_WORKSPACE"
              git worktree remove "$RUNNER_TEMP/data-branch" --force
              exit 1
            fi
            echo "banco sem mudança hoje (nada novo processado) -- pulando commit"
          else
            git commit -q -m "chore: atualiza banco — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin data
            echo "banco persistido na branch data"
          fi

          cd "$GITHUB_WORKSPACE"
          git worktree remove "$RUNNER_TEMP/data-branch" --force

      - name: Notificar falha por e-mail
        if: steps.coleta.outcome == 'failure' || steps.triagem.outcome == 'failure' || steps.analise.outcome == 'failure' || steps.boletim.outcome == 'failure' || steps.persistir.outcome == 'failure'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: |
          python -c "
          import os
          from datetime import datetime, timedelta, timezone
          from nucleo.envio import enviar_email
          # data em BRT (UTC-3 fixo, mesma convenção do resto do projeto) —
          # assunto reconhecível na caixa de entrada sem precisar abrir
          data_brt = (datetime.now(timezone.utc) - timedelta(hours=3)).strftime('%d/%m')
          assunto = f'[Boletim NexLicit] Falha na execução de {data_brt}'
          corpo = (
              '<p>O job diário do Boletim Jurídico NexLicit teve pelo menos '
              'uma etapa com falha. Confira os logs no GitHub Actions.</p>'
          )
          enviar_email(
              os.environ['EMAIL_DESTINATARIO'],
              assunto,
              corpo,
              usuario=os.environ['GMAIL_USER'],
              senha_app=os.environ['GMAIL_APP_PASSWORD'],
          )
          "

      - name: Marcar job como falho
        if: steps.coleta.outcome == 'failure' || steps.triagem.outcome == 'failure' || steps.analise.outcome == 'failure' || steps.boletim.outcome == 'failure' || steps.persistir.outcome == 'failure'
        run: exit 1
